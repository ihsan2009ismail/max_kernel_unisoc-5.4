name: Build Unisoc Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            lld \
            llvm \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            python3 \
            rsync \
            cpio \
            unzip \
            wget \
            git

      - name: Prepare
        run: |
          set -eux

          mkdir -p out

          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "LLVM=1" >> "$GITHUB_ENV"
          echo "LLVM_IAS=1" >> "$GITHUB_ENV"

      - name: Generate Unisoc defconfig
        run: |
          set -eux

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          ./scripts/sprd/sprd_create_user_config.sh \
            out/.config \
            Documentation/sprd-gki-diff-config

          cp \
            out/.config \
            arch/arm64/configs/sprd_gki_defconfig

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            sprd_gki_defconfig

      - name: Build kernel and modules
        run: |
          set -eux

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image.lz4 \
            modules

      - name: Collect artifacts
        run: |
          set -eux

          mkdir -p artifacts/modules

          cp out/arch/arm64/boot/Image.lz4 \
            artifacts/Image.lz4

          if [ -f out/Module.symvers ]; then
            cp out/Module.symvers \
              artifacts/Module.symvers
          fi

          if [ -f out/System.map ]; then
            cp out/System.map \
              artifacts/System.map
          fi

          cp out/.config \
            artifacts/config

          find out \
            -type f \
            -name '*.ko' \
            -exec cp --parents {} artifacts/modules/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unisoc-kernel-build
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

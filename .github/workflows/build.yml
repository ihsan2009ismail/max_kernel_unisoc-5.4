name: Build Unisoc Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang lld llvm flex \
            libssl-dev libelf-dev libdw-dev dwarves \
            python3 rsync cpio unzip wget git

      - name: Build kernel
        run: |
          set -eux
          mkdir -p out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            sprd_qogirl6_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            -j$(nproc) Image.lz4 modules

      - name: Collect artifacts
        run: |
          set -eux
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.lz4 artifacts/
          [ -f out/Module.symvers ] && cp out/Module.symvers artifacts/
          [ -f out/System.map ] && cp out/System.map artifacts/
          cp out/.config artifacts/config

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unisoc-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
